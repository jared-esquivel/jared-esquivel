<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-label="Hey there! I'm Jared Esquivel. Software Developer, Founder of HackWatsonville, Building What's Next.">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050b16"/><stop offset=".55" stop-color="#0B1120"/><stop offset="1" stop-color="#111C33"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F8FAFC"/><stop offset=".37" stop-color="#38BDF8"/><stop offset=".74" stop-color="#2DD4BF"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#38BDF8" stop-opacity=".34"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
  <radialGradient id="violet"><stop stop-color="#A78BFA" stop-opacity=".26"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <radialGradient id="teal"><stop stop-color="#2DD4BF" stop-opacity=".22"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="1200" height="390" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1200" height="390" fill="url(#bg)"/>
