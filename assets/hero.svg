 </g>
 <g fill="#38BDF8">
  <circle cx="887" cy="103" r="2" opacity=".7"><animate attributeName="opacity" values=".1;.8;.1" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="1075" cy="220" r="2.4" opacity=".4"><animate attributeName="opacity" values=".1;.7;.1" dur="6.5s" repeatCount="indefinite"/></circle>
  <circle cx="752" cy="289" r="1.5" opacity=".4"><animate attributeName="opacity" values=".1;.65;.1" dur="4s" repeatCount="indefinite"/></circle>
 </g>
 <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
  <text x="83" y="112" fill="#B8C8DC" font-size="23" font-weight="500" letter-spacing=".3">Hey there!</text>
  <text x="80" y="208" fill="url(#name)" font-size="76" font-weight="800" letter-spacing="-2.5">I'm Jared Esquivel</text>
  <rect x="84" y="236" width="42" height="3" rx="1.5" fill="#2DD4BF"/>
  <g font-size="26" font-weight="500" fill="#CBD5E1">
   <text x="83" y="291" opacity="1">Software Developer<animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;.27;.32;.33;.96;.99;1" dur="12s" repeatCount="indefinite"/></text>
   <text x="83" y="291" opacity="0">Founder of HackWatsonville<animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;.30;.35;.60;.65;.99;1" dur="12s" repeatCount="indefinite"/></text>
   <text x="83" y="291" opacity="0">Building What's Next.<animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.31;.34;.63;.68;.94;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <text x="84" y="352" fill="#7C91AE" font-size="15" letter-spacing="2.6">SOFTWARE  /  COMMUNITY  /  WHAT'S NEXT</text>
