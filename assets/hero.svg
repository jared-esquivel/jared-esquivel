 <ellipse cx="840" cy="85" rx="260" ry="205" fill="url(#violet)"><animate attributeName="cy" values="85;145;85" dur="14s" repeatCount="indefinite"/></ellipse>
 <ellipse cx="1070" cy="340" rx="310" ry="200" fill="url(#teal)"/>
 <g fill="none" stroke-width="1">
  <path d="M-90 65 Q270 10 610 70 T1320 46" stroke="#38BDF8" opacity=".13"><animateTransform attributeName="transform" type="translate" values="0 0;0 17;0 0" dur="13s" repeatCount="indefinite"/></path>
  <path d="M-90 124 Q270 80 630 136 T1320 103" stroke="#A78BFA" opacity=".16"><animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0" dur="16s" repeatCount="indefinite"/></path>
  <path d="M-90 245 Q290 205 660 262 T1320 229" stroke="#2DD4BF" opacity=".11"><animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="11s" repeatCount="indefinite"/></path>
